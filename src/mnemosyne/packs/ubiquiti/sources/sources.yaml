# Corpus for the Ubiquiti pack.
#
# Mnemosyne ships NO third-party documentation. This file lists *references* (public
# Ubiquiti Help Center URLs) — the documents themselves are fetched at `ingest` time and
# only the resulting FAISS index is written (to gitignored `knowledge/`); the article text
# never enters version control. Only add URLs you have the right to use.
#
# To extend: add more URLs below, or drop local .md/.txt/.html/.pdf files into this
# `sources/` directory (they're auto-discovered).
#
# A doc you can fetch yourself but can't commit here (a blocked host, or anything you don't
# want in git even transiently) does NOT belong under this `sources/` directory or in the
# `local:` list below (both are git-tracked); stage it instead via MNEMOSYNE_STAGING_DIR
# (`<dir>/ubiquiti/`); see ADR-0016.

# Local files (relative to the pack directory). Files in this `sources/` folder are also
# picked up automatically. All are self-authored primers: the seed note covers the core model
# (controller/adoption/switching/wireless), and the three `unifi-*` primers add original prose
# on security, RF, and operations to give the corpus real multi-document depth (see ADR-0012).
local:
  - ./sources/seed-unifi-concepts.md
  - ./sources/unifi-network-security.md
  - ./sources/unifi-wifi-rf.md
  - ./sources/unifi-operations.md

