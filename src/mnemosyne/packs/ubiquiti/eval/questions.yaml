# Labelled retrieval question set for the Ubiquiti / UniFi pack.
#
# Ground truth = expected substrings (see ADR-0006), each drawn verbatim from a local source
# file in sources/ (the seed note plus the unifi-* primers). A question "hits" iff EVERY
# `expected` item is satisfied (case-insensitive) in the concatenated top-k retrieved chunks.
# An item is either a single required substring, or a list of interchangeable alternatives (an
# OR-group) of which any one satisfies it. Use an OR-group when the same fact is worded
# differently across sources, so a correct answer counts regardless of how a source words it
# (e.g. "native (untagged)" vs "untagged network" for the same fact). Author questions only
# from text that is actually in the corpus; if a fact isn't there, it doesn't belong here. The
# first block covers the seed (core model); the second covers the security, RF, and operations
# primers (added in ADR-0014, issue #41); the third covers the VPN, DNS, and QoS primers (the
# curated re-grow following the harvest decline, ADR-0026, under the ADR-0020 contract).
#
# All questions are curated: their ground truth lives in the self-authored primers. A fetched
# help.ui.com harvest was reviewed and declined on licensing grounds (ADR-0026), so this pack
# ships no `corpus: fetched` questions. The loader's `corpus`/`--include-fetched` machinery
# (ADR-0020) stays generic for any future, properly-licensed corpus.
questions:
  - id: unifi-model
    question: How is a UniFi network organized around the controller?
    expected:
      - controller
      - "switches, access points, gateways"
      - site
    note: The controller/devices/site split.

  - id: controller-vs-device
    question: In the UniFi model, who decides configuration and who applies it?
    expected:
      - "the controller decides, the device enforces"

  - id: adoption-lifecycle
    question: What stages does a device move through during adoption?
    expected:
      - Pending Adoption
      - Adopting
      - Provisioning
      - Connected

  - id: adoption-prerequisites
    question: What does a device need in order to be adopted by a controller?
    expected:
      - Layer 3
      - reachability
      - inform URL

  - id: adoption-loop
    question: What is an adoption loop and what commonly causes it?
    expected:
      - adoption loop
      - factory reset

  - id: set-inform
    question: How do you point a UniFi device at its controller manually over SSH?
    expected:
      - "set-inform http://<host>:8080/inform"

  - id: port-profiles
    question: What does a UniFi port profile bundle together?
    expected:
      - port profile
      - native
      - tagged networks

  - id: trunk-vs-access
    question: What distinguishes a trunk port from an access port on a UniFi switch?
    expected:
      - - untagged network
        - native (untagged)
      - tagged VLANs
      - trunk

  - id: poe-cycle
    question: How can you power-cycle a stuck access point from a UniFi switch?
    expected:
      - PoE
      - power-cycling a stuck AP

  - id: wlan-vlan
    question: How is guest vs IoT vs main separation expressed in UniFi wireless?
    expected:
      - WLAN
      - VLAN-backed networks

  # --- Questions over the unifi-* primers (security, RF, operations; ADR-0014, issue #41) ---

  - id: vlan-segmentation
    question: Why segment a UniFi network into VLANs?
    expected:
      - blast radius
      - trust levels apart
    note: From the network-security primer.

  - id: firewall-default-deny
    question: What firewall posture should a UniFi gateway start from?
    expected:
      - default-deny
      - block traffic between segments

  - id: wpa3-pmf
    question: What does WPA3 add over WPA2, and what is PMF?
    expected:
      - Simultaneous Authentication of Equals
      - forward secrecy
      - Protected Management Frames

  - id: channel-2-4ghz
    question: Which 2.4 GHz channels and channel width should a UniFi network use?
    expected:
      - "1, 6, and 11"
      - 20 MHz

  - id: roaming-amendments
    question: Which 802.11 amendments improve roaming between UniFi access points?
    expected:
      - 802.11r
      - 802.11k
      - 802.11v

  - id: minimum-rssi
    question: What does the minimum RSSI setting do, and what values are aggressive vs conservative?
    expected:
      - Minimum RSSI
      - "-75 dBm is aggressive"
      - "-85 dBm conservative"

  - id: stuck-adopting
    question: How do you recover a UniFi device stuck in the Adopting state?
    expected:
      - Forget the device
      - port 8080
      - set-inform

  - id: udm-se-firmware
    question: Why must UDM SE and UDM Pro firmware be upgraded over SSH instead of the controller API?
    expected:
      - UDM SE
      - cannot upgrade them
      - ubnt-systool fwupdate

  - id: firmware-backup
    question: What should you do before upgrading UniFi firmware?
    expected:
      - controller backup
      - read the release notes

  # --- Questions over the VPN, DNS, and QoS primers (curated re-grow; ADR-0020 contract,
  # ADR-0026 curated-only disposition). Every expected item is an identifier drawn verbatim
  # from its primer and co-located in one chunk (ADR-0006, ADR-0022). ---

  - id: vpn-site-magic
    question: What is UniFi Site Magic and what does it automate?
    expected:
      - Site Magic
      - SD-WAN
      - site-to-site
    note: Automatic site-to-site SD-WAN meshing UniFi gateways across locations.

  - id: wireguard-port
    question: What transport and default port does the UniFi WireGuard VPN server use?
    expected:
      - WireGuard
      - UDP
      - "51820"
    note: WireGuard's default listen port (a WireGuard fact, not a Ubiquiti one).

  - id: teleport-vpn
    question: How does UniFi Teleport grant remote access without manual client configuration?
    expected:
      - Teleport
      - invite
      - WireGuard
    note: Zero-config remote access; a one-click invite link, WireGuard under the hood.

  - id: dns-port
    question: What port does DNS use on a UniFi gateway?
    expected:
      - DNS
      - port 53
    note: The standard DNS port (UDP/TCP), IANA-assigned.

  - id: dns-record-types
    question: What local DNS record types can you create on a UniFi gateway?
    expected:
      - A record
      - CNAME
      - SRV
    note: Local DNS records for internal name resolution.

  - id: mdns-across-vlans
    question: How does UniFi let AirPlay and Chromecast discovery work across VLANs?
    expected:
      - mDNS
      - "5353"
      - VLAN
    note: A multicast DNS (UDP 5353) reflector relays service discovery across segments.

  - id: smart-queues
    question: What does UniFi Smart Queues do and what algorithm backs it?
    expected:
      - Smart Queues
      - fq_codel
      - bufferbloat
    note: fq_codel bufferbloat control; set the limits just below the ISP line rate.

  - id: qos-dscp
    question: How does UniFi mark packets for QoS prioritization?
    expected:
      - DSCP
      - IP Precedence
    note: DSCP / IP Precedence marking.

  - id: wmm-wireless-qos
    question: What standard provides QoS prioritization over WiFi in UniFi?
    expected:
      - WMM
      - 802.11e
    note: WiFi Multimedia, the 802.11e wireless QoS standard.
