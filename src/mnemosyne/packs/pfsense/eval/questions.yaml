# Labelled retrieval question set for the pfSense pack.
#
# Ground truth = expected substrings (see ADR-0006), each drawn verbatim from a local source
# file in sources/. A question "hits" iff EVERY string in `expected` appears (case-insensitive)
# in the concatenated top-k retrieved chunks. Author questions only from text that is actually
# in the corpus. All questions are curated (local ground truth); a `corpus: fetched` block for
# fetched Netgate pages is a later roadmap step (ADR-0020 pattern).
questions:
  # --- Core concepts (pfsense-core-concepts.md) ---
  - id: pf-platform
    question: What operating system and packet filter is pfSense built on?
    expected:
      - FreeBSD
      - pf packet filter
    note: Core platform.

  - id: default-lan-ip
    question: What is the default LAN IP address of a fresh pfSense installation?
    expected:
      - 192.168.1.1
    note: Default LAN /24.

  - id: webgui
    question: What is the pfSense web management interface called?
    expected:
      - webConfigurator
    note: The web GUI, reached over HTTPS at the LAN IP.

  - id: anti-lockout
    question: What default rule keeps an administrator from being locked out of the pfSense LAN?
    expected:
      - anti-lockout
    note: Default anti-lockout rule on the LAN.

  # --- Firewall rules (pfsense-firewall-rules.md) ---
  - id: rule-order
    question: In what order does pfSense evaluate the firewall rules on an interface?
    expected:
      - first match
      - top down
    note: Top-down, first match wins.

  - id: rule-direction
    question: In which direction are pfSense interface firewall rules applied?
    expected:
      - inbound
    note: Inbound on the interface.

  - id: stateful
    question: Are pfSense firewall rules stateful by default?
    expected:
      - stateful
      - state table
    note: Stateful by default; a state table entry per allowed flow.

  # --- NAT and VPN (pfsense-nat-vpn.md) ---
  - id: outbound-nat-modes
    question: What are the outbound NAT modes available in pfSense?
    expected:
      - Automatic
      - Hybrid
      - Manual
      - Disabled
    note: The four outbound NAT modes.

  - id: port-forward
    question: How do you allow inbound access to an internal server behind pfSense?
    expected:
      - port forward
    note: A port forward (destination NAT).

  - id: vpn-builtin
    question: Which VPN types does pfSense include in the base system?
    expected:
      - OpenVPN
      - IPsec
    note: OpenVPN and IPsec built in; WireGuard is an add-on package.

  # --- High availability (pfsense-high-availability.md) ---
  - id: carp-protocol
    question: What protocol lets two pfSense firewalls share a virtual IP for high availability?
    expected:
      - CARP
      - Common Address Redundancy Protocol
    note: CARP shares a CARP VIP between the master and backup nodes.

  - id: pfsync-state
    question: How does a pfSense HA cluster keep established connections alive across a failover?
    expected:
      - pfsync
      - state table
    note: pfsync synchronizes the firewall state table between nodes.

  - id: xmlrpc-config-sync
    question: What synchronizes configuration from the primary pfSense node to the secondary?
    expected:
      - XMLRPC
      - configuration synchronization
    note: XMLRPC config sync, enabled on the primary node only.

  # --- Packages (pfsense-packages.md) ---
  - id: ids-ips-packages
    question: Which two add-on packages provide IDS/IPS on pfSense?
    expected:
      - Snort
      - Suricata
    note: The two intrusion detection/prevention packages.

  - id: pfblockerng-dnsbl
    question: Which pfSense package blocks unwanted domains and IP ranges, and what is its domain-blocking feature called?
    expected:
      - pfBlockerNG
      - DNSBL
    note: pfBlockerNG; DNSBL is its DNS blocklist.

  # --- DNS services (pfsense-services.md) ---
  - id: dns-resolver-unbound
    question: What software backs the pfSense DNS Resolver?
    expected:
      - Unbound
    note: The DNS Resolver is Unbound.

  - id: dns-forwarder-dnsmasq
    question: What software backs the pfSense DNS Forwarder?
    expected:
      - dnsmasq
    note: The DNS Forwarder is dnsmasq.
