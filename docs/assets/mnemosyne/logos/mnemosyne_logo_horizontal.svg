<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" role="img" aria-label="Mnemosyne Recall — Retrieve, Augment, Generate">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A2C39"/><stop offset="1" stop-color="#0F1C25"/>
    </linearGradient>
    <linearGradient id="mem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A78BD0"/><stop offset="1" stop-color="#6A5A9E"/>
    </linearGradient>
    <linearGradient id="src" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6E9DBA"/><stop offset="1" stop-color="#4E7C97"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A78BD0" stop-opacity="0.55"/><stop offset="1" stop-color="#A78BD0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- panel -->
  <rect x="1" y="1" width="798" height="258" rx="28" fill="url(#bg)" stroke="#2C4C61" stroke-width="1.5"/>

  <!-- retrieval constellation: source nodes (documents) feed edges into the central memory/index -->
  <g transform="translate(80,58)">
    <g stroke="#6A5A9E" fill="none" stroke-linecap="round" opacity="0.45" stroke-width="2.5">
      <line x1="85" y1="72" x2="85"  y2="12"/>
      <line x1="85" y1="72" x2="28"  y2="53.5"/>
      <line x1="85" y1="72" x2="49.7" y2="120.5"/>
      <line x1="85" y1="72" x2="120.3" y2="120.5"/>
      <line x1="85" y1="72" x2="142"  y2="53.5"/>
    </g>
    <circle cx="85" cy="72" r="44" fill="url(#glow)"/>
    <!-- source nodes -->
    <g fill="url(#src)" stroke="#EAF2F7" stroke-opacity="0.10" stroke-width="1">
      <circle cx="85"   cy="12"    r="8"/>
      <circle cx="28"   cy="53.5"  r="8"/>
      <circle cx="49.7" cy="120.5" r="8"/>
      <circle cx="120.3" cy="120.5" r="8"/>
      <circle cx="142"  cy="53.5"  r="8"/>
    </g>
    <!-- central memory / index node -->
    <circle cx="85" cy="72" r="22" fill="url(#mem)" stroke="#EAF2F7" stroke-opacity="0.14" stroke-width="1.5"/>
    <circle cx="92" cy="65" r="5" fill="#F3ECFB" opacity="0.92"/>
  </g>

  <!-- wordmark: two-tone name (the long name is split for the family's accent treatment,
       so nothing overflows the 800-wide canvas) -->
  <g font-family="'Segoe UI','SF Pro Display',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">
    <text x="306" y="112" font-size="58" font-weight="800" letter-spacing="0.5" fill="#EAF2F7">MNEMO<tspan fill="#A78BD0">SYNE</tspan></text>
    <rect x="308" y="130" width="382" height="3" rx="1.5" fill="#A78BD0" opacity="0.85"/>
    <text x="310" y="162" font-size="14.5" font-weight="600" letter-spacing="2.2" fill="#7FA6BC">RETRIEVE · AUGMENT · GENERATE</text>
    <text x="310" y="200" font-size="21" font-weight="800" letter-spacing="5.5" fill="#C5953F">MEMORY OF THE MUSES</text>
  </g>
</svg>
