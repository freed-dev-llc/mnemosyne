line-length = 100
target-version = "py311"
src = ["src", "tests"]

[lint]
select = ["E", "F", "I", "UP", "B", "S", "C4", "SIM", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"examples/**" = ["S101"]
# Typer relies on function calls (typer.Argument/Option) in parameter defaults.
"src/mnemosyne/cli.py" = ["B008"]
