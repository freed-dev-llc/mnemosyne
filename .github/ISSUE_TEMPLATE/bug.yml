name: Bug report
description: Something isn't working as documented.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact commands (e.g. `mnemosyne ingest ubiquiti`) and pack used.
      render: shell
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Environment
      description: Mnemosyne version, Python version, OS, Ollama version + models pulled.
      placeholder: "mnemosyne 0.1.0 · Python 3.12 · Linux · ollama 0.x · bge-m3, qwen2.5:1.5b"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      render: shell
