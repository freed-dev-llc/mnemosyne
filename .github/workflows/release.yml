name: Release

# Build the sdist + wheel for a pushed version tag, create a draft GitHub release with
# artifacts attached, and publish to PyPI via trusted publishing (OIDC, no token).
#
# Flow: push the signed `vX.Y.Z` tag -> this builds the artifacts, creates a DRAFT GitHub
# release (via the gh CLI) with auto-generated notes, and publishes to PyPI. The maintainer
# can then curate the GitHub release notes and publish it. `workflow_dispatch` re-runs the
# build for an existing tag (e.g. after a failed run); if the release already exists it
# refreshes the assets instead of recreating it.
#
# PyPI auth is trusted publishing (OIDC), matching argus: no API token, the `id-token: write`
# permission lets PyPI verify this workflow's identity. The PyPI project must have a matching
# (pending) publisher configured first; see CONTRIBUTING.md.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build and attach artifacts to (e.g. v0.3.0)"
        required: true

permissions:
  contents: write # required to create the release and upload assets
  id-token: write # required for PyPI trusted publishing (OIDC) and Sigstore signing
  attestations: write # required to store the build provenance attestation

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    # On a tag push, github.ref_name is the tag; on workflow_dispatch it is a branch, so fall
    # back to the `tag` input. Used for both the checkout ref and the release's tag_name.
    env:
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Pure-Python build: only setuptools + wheel are needed (FAISS is a runtime conda/pip
      # extra, never a build dependency), so this needs no mamba env, unlike the CI `build` job.
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*
      # Attest build provenance for the artifacts attached to the GitHub release. PyPI uploads
      # get their own PEP 740 attestation from the publish action below; this covers the copies
      # on the release page. Verify with:
      #   gh attestation verify <file> --repo freed-dev-llc/mnemosyne
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      # New tag -> create a DRAFT release with auto-generated notes + artifacts. On a
      # workflow_dispatch re-run where the release already exists, refresh the assets instead and
      # leave any curated notes untouched. Uses the runner's pre-installed gh CLI, no third-party
      # action.
      - name: Draft release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.whl dist/*.tar.gz --clobber
          else
            gh release create "$TAG" --draft --generate-notes dist/*.whl dist/*.tar.gz
          fi
      # Publish to PyPI via trusted publishing (OIDC). The action reads dist/ built above and
      # authenticates with the OIDC token from the id-token permission; no stored secret.
      # skip-existing keeps a workflow_dispatch re-run from failing on an already-published
      # version.
      # Pinned to a commit SHA because this job holds the OIDC publish identity; a moving tag
      # or branch ref would let a compromised upstream release publish as this project.
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
